<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<style>
  :root {
    --bg: #302e2b;
    --panel: #262421;
    --panel2: #21201d;
    --text: #fff;
    --muted: #a7a6a2;
    --green: #81b64c;
    --green-dark: #457524;
    --light: #ebecd0;
    --dark: #739552;
    --hl-light: #f5f682;
    --hl-dark: #b9ca43;
    --bs: clamp(280px, min(calc(100vh - 130px), calc(100vw - 400px)), 760px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }

  /* ───────── Home ───────── */
  #home {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 32px 34px;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .logo { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 2rem; font-weight: 800; letter-spacing: -.5px; }
  .logo span { color: var(--green); font-size: 2.4rem; }
  .sub { text-align: center; color: var(--muted); font-size: .95rem; margin-bottom: 4px; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 6px; border: 2px solid #3d3a37;
    background: #1b1a18; color: #fff; font-size: 1rem; outline: none;
  }
  .input:focus { border-color: var(--green); }
  .btn {
    border: none; cursor: pointer; border-radius: 8px; padding: 14px 18px;
    font-size: 1.05rem; font-weight: 700; color: #fff; transition: filter .12s, transform .05s;
  }
  .btn:active { transform: translateY(2px); }
  .btn:hover { filter: brightness(1.08); }
  .btn-green { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn-green:active { box-shadow: 0 2px 0 var(--green-dark); }
  .btn-grey { background: #3d3a37; box-shadow: 0 4px 0 #2a2826; }
  .btn-grey:active { box-shadow: 0 2px 0 #2a2826; }
  .btn:disabled { opacity: .55; cursor: default; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: #3d3a37; }
  .row { display: flex; gap: 8px; }
  .row .input { flex: 1; }
  .err { color: #ff7b72; font-size: .9rem; min-height: 1.2em; text-align: center; }
  #waiting { display: none; text-align: center; }
  #waiting .spinner {
    width: 38px; height: 38px; border-radius: 50%; margin: 4px auto;
    border: 4px solid #3d3a37; border-top-color: var(--green); animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #invite-link {
    background: #1b1a18; border-radius: 6px; padding: 12px; font-size: .85rem;
    color: var(--green); word-break: break-all; user-select: all;
  }

  /* ───────── Game layout ───────── */
  #game { display: none; min-height: 100%; padding: 12px; justify-content: center; align-items: flex-start; gap: 16px; }
  #board-col { width: var(--bs); display: flex; flex-direction: column; gap: 6px; }

  .pbar { display: flex; align-items: center; gap: 10px; height: 38px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 4px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.1rem; color: #fff;
  }
  .avatar.w { background: #8a8986; }
  .avatar.b { background: #4b4947; }
  .pinfo { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .pname { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcap { display: flex; align-items: center; height: 18px; font-size: .75rem; color: var(--muted); }
  .pcap .grp { display: inline-flex; margin-right: 4px; }
  .pcap img { width: 18px; height: 18px; margin-right: -9px; }
  .pcap .grp::after { content: ''; width: 9px; }
  .pcap .adv { margin-left: 4px; font-weight: 700; }

  #board-wrap { position: relative; width: var(--bs); height: var(--bs); border-radius: 5px; overflow: hidden; }
  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: 100%; height: 100%; user-select: none; touch-action: none;
  }
  .sq { position: relative; }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.light.last, .sq.light.sel { background: var(--hl-light); }
  .sq.dark.last, .sq.dark.sel { background: var(--hl-dark); }
  .sq.check {
    background-image: radial-gradient(ellipse at center, #ff0000 0%, #e70000 25%, rgba(169,0,0,0) 89%, rgba(158,0,0,0) 100%);
  }
  .sq .piece {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2;
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }
  .sq .coord { position: absolute; font-size: calc(var(--bs) / 48); font-weight: 700; z-index: 1; pointer-events: none; line-height: 1; }
  .sq.light .coord { color: var(--dark); }
  .sq.dark .coord { color: var(--light); }
  .coord.rank { top: 3px; left: 4px; }
  .coord.file { bottom: 3px; right: 4px; }
  .dot { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: rgba(0,0,0,.14); pointer-events: none; z-index: 3; }
  .ring { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(transparent 0%, transparent 79%, rgba(0,0,0,.14) 80%); }
  #ghost { position: fixed; z-index: 1000; pointer-events: none; display: none; }

  /* Promotion picker */
  #promo { position: absolute; inset: 0; display: none; background: rgba(0,0,0,.45); z-index: 20; }
  #promo .col { position: absolute; width: 12.5%; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #promo .opt { aspect-ratio: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #promo .opt:hover { background: #e8e8e8; }
  #promo .opt img { width: 92%; height: 92%; }

  /* Result modal */
  #result { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); z-index: 30; }
  #result .box {
    background: var(--panel); border-radius: 10px; width: min(86%, 330px); overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); position: relative;
  }
  #result .head { background: var(--panel2); padding: 20px 16px 14px; text-align: center; }
  #result .title { font-size: 1.6rem; font-weight: 800; }
  #result .why { color: var(--muted); font-size: .95rem; margin-top: 4px; }
  #result .btns { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #result .x { position: absolute; top: 6px; right: 10px; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }

  /* ───────── Side panel ───────── */
  #side {
    width: 340px; background: var(--panel); border-radius: 8px; display: flex; flex-direction: column;
    height: calc(var(--bs) + 82px); overflow: hidden; flex: none;
  }
  #side .top { padding: 14px 16px; background: var(--panel2); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  #side .top span { color: var(--green); font-size: 1.4rem; }
  #status { padding: 10px 16px; font-size: .95rem; color: var(--muted); border-bottom: 1px solid #1c1b19; min-height: 42px; display: flex; align-items: center; gap: 8px; }
  #status .led { width: 10px; height: 10px; border-radius: 50%; background: #6b6a67; flex: none; }
  #status.mine { color: #fff; }
  #status.mine .led { background: var(--green); }
  #moves { flex: 1; overflow-y: auto; padding: 6px 0; }
  .mrow { display: grid; grid-template-columns: 42px 1fr 1fr; font-size: .95rem; }
  .mrow:nth-child(odd) { background: rgba(255,255,255,.03); }
  .mrow .n { color: var(--muted); padding: 6px 0 6px 12px; }
  .mrow .m { padding: 6px 10px; cursor: pointer; font-weight: 600; border-radius: 3px; }
  .mrow .m:hover { background: rgba(255,255,255,.08); }
  .mrow .m.active { background: rgba(255,255,255,.18); }
  #nav { display: flex; border-top: 1px solid #1c1b19; }
  #nav button { flex: 1; background: none; border: none; color: var(--muted); font-size: 1.15rem; padding: 12px 0; cursor: pointer; }
  #nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
  #offer { display: none; padding: 10px 16px; background: #3a3835; font-size: .9rem; gap: 8px; align-items: center; justify-content: space-between; }
  #offer button { border: none; border-radius: 5px; padding: 6px 12px; font-weight: 700; cursor: pointer; color: #fff; }
  #acts { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #1c1b19; }
  #acts button { flex: 1; background: #3d3a37; color: #e6e5e3; border: none; border-radius: 6px; padding: 10px 4px; font-size: .85rem; font-weight: 700; cursor: pointer; }
  #acts button:hover { background: #4a4744; }
  #acts button:disabled { opacity: .4; cursor: default; }
  #acts .danger:hover { background: #8c2d2d; }

  /* ───────── Mobile ───────── */
  @media (max-width: 900px) {
    :root { --bs: clamp(280px, calc(100vw - 16px), 600px); }
    #game { flex-direction: column; align-items: center; padding: 8px; }
    #side { width: var(--bs); height: auto; }
    #moves { max-height: 130px; }
  }
</style>
</head>
<body>

<!-- ───────── HOME ───────── -->
<div id="home">
  <div class="card" id="lobby">
    <div class="logo"><span>♞</span> Chess</div>
    <div class="sub">Play a friend online — free, no sign-up</div>
    <input class="input" id="name" placeholder="Your name" maxlength="16" autocomplete="off">
    <button class="btn btn-green" id="create">Play a Friend</button>
    <div class="or">or join a game</div>
    <div class="row">
      <input class="input" id="code" placeholder="Game code" maxlength="8" autocomplete="off">
      <button class="btn btn-grey" id="join">Join</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card" id="waiting">
    <div class="logo"><span>♞</span> Chess</div>
    <div class="spinner"></div>
    <div style="font-weight:700">Waiting for your opponent…</div>
    <div class="sub" style="margin:0">Send them this link to start the game:</div>
    <div id="invite-link"></div>
    <button class="btn btn-green" id="copy">Copy Link</button>
  </div>
</div>

<!-- ───────── GAME ───────── -->
<div id="game">
  <div id="board-col">
    <div class="pbar" id="bar-top">
      <div class="avatar" id="av-top"></div>
      <div class="pinfo"><div class="pname" id="nm-top"></div><div class="pcap" id="cap-top"></div></div>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
      <div id="promo"></div>
      <div id="result">
        <div class="box">
          <button class="x" id="result-x" title="Close">×</button>
          <div class="head"><div class="title" id="r-title"></div><div class="why" id="r-why"></div></div>
          <div class="btns">
            <button class="btn btn-green" id="rematch">Rematch</button>
            <button class="btn btn-grey" id="newgame">New Game</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pbar" id="bar-bot">
      <div class="avatar" id="av-bot"></div>
      <div class="pinfo"><div class="pname" id="nm-bot"></div><div class="pcap" id="cap-bot"></div></div>
    </div>
  </div>

  <aside id="side">
    <div class="top"><span>♞</span> Play Chess</div>
    <div id="status"><div class="led"></div><div id="status-text">Connecting…</div></div>
    <div id="moves"></div>
    <div id="nav">
      <button id="n-first" title="First move">⏮</button>
      <button id="n-prev" title="Previous">◀</button>
      <button id="n-next" title="Next">▶</button>
      <button id="n-last" title="Latest">⏭</button>
    </div>
    <div id="offer"><span>Opponent offers a draw</span>
      <span><button id="d-yes" style="background:#81b64c">Accept</button> <button id="d-no" style="background:#4a4744">Decline</button></span>
    </div>
    <div id="acts">
      <button id="b-draw">½ Draw</button>
      <button id="b-resign" class="danger">⚑ Resign</button>
      <button id="b-flip">⇅ Flip</button>
      <button id="b-sound">🔊</button>
    </div>
  </aside>
</div>

<div id="ghost"><img id="ghost-img" style="width:100%;height:100%"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const FILES = 'abcdefgh';
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const START_COUNT = { P: 8, N: 2, B: 2, R: 2, Q: 1 };
  const VAL = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
  const pieceUrl = (code) => `/pieces/${code}.svg`;

  let socket = null;
  let myColor = 'w', flipped = false;
  let state = null;
  let viewIdx = null;          // null = live position, else index of move (-1 = start)
  let selected = null;
  let drag = null;
  let pendingPromo = null;
  let soundOn = true;
  let resignArmed = null;
  let rematchSent = false;

  // ───────── Utilities ─────────
  function parseFen(fen) {
    return fen.split(' ')[0].split('/').map((row) => {
      const out = [];
      for (const ch of row) {
        if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) out.push(null);
        else out.push((ch === ch.toUpperCase() ? 'w' : 'b') + ch.toUpperCase());
      }
      return out;
    });
  }
  function pieceAt(grid, sq) {
    return grid[8 - parseInt(sq[1], 10)][FILES.indexOf(sq[0])];
  }
  function viewData() {
    if (!state) return null;
    if (viewIdx === null) return { fen: state.fen, last: state.lastMove, live: true };
    if (viewIdx < 0) return { fen: START_FEN, last: null, live: false };
    const m = state.moves[viewIdx];
    return { fen: m.after, last: { from: m.from, to: m.to }, live: false };
  }
  const saveName = (n) => { try { localStorage.setItem('chess_name', n); } catch (e) {} };
  const loadName = () => { try { return localStorage.getItem('chess_name') || ''; } catch (e) { return ''; } };
  const myName = () => $('name').value.trim() || loadName() || ('Guest' + Math.floor(100 + Math.random() * 900));

  // ───────── Sounds (synthesised, no files needed) ─────────
  let ac = null;
  function ensureAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, delay = 0) {
    if (!soundOn || !ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function play(kind) {
    ensureAudio();
    if (kind === 'move') tone(220, 0.09, 'triangle', 0.35);
    else if (kind === 'capture') { tone(170, 0.14, 'square', 0.18); tone(110, 0.14, 'triangle', 0.35); }
    else if (kind === 'check') { tone(660, 0.12, 'sine', 0.25); tone(880, 0.16, 'sine', 0.25, 0.1); }
    else if (kind === 'start') { tone(440, 0.15, 'sine', 0.22); tone(660, 0.2, 'sine', 0.22, 0.12); }
    else if (kind === 'end') { tone(520, 0.25, 'sine', 0.25); tone(390, 0.25, 'sine', 0.25, 0.18); tone(260, 0.4, 'sine', 0.25, 0.36); }
  }

  // ───────── Socket ─────────
  function connect() {
    if (socket) return socket;
    socket = io();

    socket.on('room_created', ({ roomId }) => {
      const link = `${location.origin}/?room=${roomId}`;
      $('invite-link').textContent = link;
      $('lobby').style.display = 'none';
      $('waiting').style.display = 'flex';
    });

    socket.on('game_start', ({ color, state: s }) => {
      myColor = color; flipped = color === 'b';
      state = s; viewIdx = null; selected = null; rematchSent = false;
      $('home').style.display = 'none';
      $('game').style.display = 'flex';
      $('result').style.display = 'none';
      $('rematch').disabled = false; $('rematch').textContent = 'Rematch';
      $('offer').style.display = 'none';
      history.replaceState(null, '', '/');
      renderAll();
      play('start');
    });

    socket.on('game_update', ({ state: s }) => {
      const prevLen = state ? state.moves.length : 0;
      state = s; selected = null;
      if (viewIdx !== null && viewIdx >= state.moves.length - 1) viewIdx = null;
      $('offer').style.display = 'none';
      renderAll();
      if (state.moves.length > prevLen) {
        const last = state.moves[state.moves.length - 1];
        if (state.over) play('end');
        else if (state.inCheck) play('check');
        else play(last.captured ? 'capture' : 'move');
      } else if (state.over) play('end');
      if (state.over) setTimeout(showResult, 450);
    });

    socket.on('draw_offered', () => { $('offer').style.display = 'flex'; });
    socket.on('draw_declined', () => { setStatusText('Opponent declined the draw', false); });
    socket.on('rematch_offered', () => {
      if ($('result').style.display !== 'flex') showResult();
      $('r-why').textContent = 'Your opponent wants a rematch';
    });
    socket.on('opponent_left', () => {
      setStatusText('Your opponent left the game', false);
      if (state && !state.over) state.over = { reason: 'left', winner: myColor };
      $('b-draw').disabled = true; $('b-resign').disabled = true;
      $('rematch').disabled = true;
    });
    socket.on('err_msg', (m) => { $('err').textContent = m; });
    return socket;
  }

  // ───────── Home screen ─────────
  $('name').value = loadName();
  $('create').onclick = () => {
    ensureAudio();
    const n = myName(); saveName(n);
    connect().emit('create_room', { name: n });
  };
  function join(code) {
    ensureAudio();
    code = (code || '').trim().toLowerCase();
    if (!code) return;
    $('err').textContent = '';
    const n = myName(); saveName(n);
    connect().emit('join_room', { roomId: code, name: n });
  }
  $('join').onclick = () => join($('code').value);
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join($('code').value); });
  $('copy').onclick = () => {
    const t = $('invite-link').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
      () => { $('copy').textContent = 'Copied ✓'; setTimeout(() => ($('copy').textContent = 'Copy Link'), 1500); },
      () => { const r = document.createRange(); r.selectNodeContents($('invite-link')); getSelection().removeAllRanges(); getSelection().addRange(r); }
    );
  };
  const urlRoom = new URLSearchParams(location.search).get('room');
  if (urlRoom) { $('code').value = urlRoom; join(urlRoom); }

  // ───────── Rendering ─────────
  function renderAll() {
    renderBoard(); renderBars(); renderMoves(); renderStatus();
    $('b-draw').disabled = !!state.over; $('b-resign').disabled = !!state.over;
  }

  function renderBoard() {
    const v = viewData(); if (!v) return;
    const grid = parseFen(v.fen);
    const board = $('board');
    const interactive = v.live && !state.over && state.turn === myColor;
    const targets = interactive && selected ? (state.legal[selected] || []) : [];
    let kingSq = null;
    if (v.live && state.inCheck) {
      const k = state.turn + 'K';
      for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) if (grid[r][f] === k) kingSq = FILES[f] + (8 - r);
    }
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 64; i++) {
      const dr = Math.floor(i / 8), df = i % 8;
      const r = flipped ? 7 - dr : dr, f = flipped ? 7 - df : df;
      const sq = FILES[f] + (8 - r);
      const d = document.createElement('div');
      d.className = 'sq ' + ((r + f) % 2 === 0 ? 'light' : 'dark');
      d.dataset.sq = sq;
      if (v.last && (v.last.from === sq || v.last.to === sq)) d.classList.add('last');
      if (interactive && selected === sq) d.classList.add('sel');
      if (kingSq === sq) d.classList.add('check');
      if (df === 0) { const c = document.createElement('span'); c.className = 'coord rank'; c.textContent = 8 - r; d.appendChild(c); }
      if (dr === 7) { const c = document.createElement('span'); c.className = 'coord file'; c.textContent = FILES[f]; d.appendChild(c); }
      const p = grid[r][f];
      if (p) {
        const img = document.createElement('img');
        img.className = 'piece'; img.src = pieceUrl(p); img.draggable = false; img.alt = '';
        d.appendChild(img);
      }
      if (targets.includes(sq)) {
        const m = document.createElement('div');
        m.className = p ? 'ring' : 'dot';
        d.appendChild(m);
      }
      frag.appendChild(d);
    }
    board.replaceChildren(frag);
  }

  function capturedInfo(fen) {
    const grid = parseFen(fen);
    const have = { w: {}, b: {} };
    for (const row of grid) for (const p of row) if (p && p[1] !== 'K') have[p[0]][p[1]] = (have[p[0]][p[1]] || 0) + 1;
    const lost = { w: [], b: [] }; // pieces of that colour that are missing
    const score = { w: 0, b: 0 };
    for (const t of ['Q', 'R', 'B', 'N', 'P']) {
      for (const c of ['w', 'b']) {
        const n = Math.max(0, START_COUNT[t] - (have[c][t] || 0));
        for (let i = 0; i < n; i++) lost[c].push(t);
        score[c] += (have[c][t] || 0) * VAL[t];
      }
    }
    return { lost, score };
  }

  function renderBars() {
    const opp = myColor === 'w' ? 'b' : 'w';
    const v = viewData();
    const { lost, score } = capturedInfo(v.fen);
    const make = (color, avId, nmId, capId) => {
      const name = state.names[color] || 'Opponent';
      $(nmId).textContent = name + (color === myColor ? ' (you)' : '');
      const av = $(avId); av.className = 'avatar ' + color; av.textContent = name[0].toUpperCase();
      // pieces this player has captured = missing pieces of the other colour
      const other = color === 'w' ? 'b' : 'w';
      const cap = $(capId); cap.replaceChildren();
      const byType = {};
      for (const t of lost[other]) (byType[t] = byType[t] || []).push(t);
      for (const t of ['Q', 'R', 'B', 'N', 'P']) {
        if (!byType[t]) continue;
        const g = document.createElement('span'); g.className = 'grp';
        for (let i = 0; i < byType[t].length; i++) {
          const im = document.createElement('img'); im.src = pieceUrl(other + t); im.alt = ''; g.appendChild(im);
        }
        cap.appendChild(g);
      }
      const diff = score[color] - score[other];
      if (diff > 0) { const a = document.createElement('span'); a.className = 'adv'; a.textContent = '+' + diff; cap.appendChild(a); }
    };
    make(opp, 'av-top', 'nm-top', 'cap-top');
    make(myColor, 'av-bot', 'nm-bot', 'cap-bot');
  }

  function renderMoves() {
    const box = $('moves'); box.replaceChildren();
    const mv = state.moves;
    const activeIdx = viewIdx === null ? mv.length - 1 : viewIdx;
    for (let i = 0; i < mv.length; i += 2) {
      const row = document.createElement('div'); row.className = 'mrow';
      const n = document.createElement('div'); n.className = 'n'; n.textContent = i / 2 + 1 + '.';
      row.appendChild(n);
      for (let j = i; j < i + 2; j++) {
        const c = document.createElement('div'); c.className = 'm';
        if (mv[j]) {
          c.textContent = mv[j].san;
          if (j === activeIdx) c.classList.add('active');
          c.onclick = () => { viewIdx = j >= mv.length - 1 ? null : j; selected = null; renderAll(); };
        }
        row.appendChild(c);
      }
      box.appendChild(row);
    }
    if (viewIdx === null) box.scrollTop = box.scrollHeight;
  }

  function setStatusText(t, mine) {
    $('status-text').textContent = t;
    $('status').classList.toggle('mine', !!mine);
  }
  function renderStatus() {
    if (state.over) {
      const { title, why } = resultText();
      return setStatusText(`${title} — ${why}`, false);
    }
    if (viewIdx !== null) return setStatusText('Reviewing moves — press ⏭ to return', false);
    const mine = state.turn === myColor;
    setStatusText((mine ? 'Your turn' : "Opponent's turn") + (state.inCheck ? ' — Check!' : ''), mine);
  }

  function resultText() {
    const o = state.over;
    const win = o.winner === myColor;
    let title = !o.winner ? 'Draw' : win ? 'You Won!' : 'You Lost';
    const why = {
      checkmate: 'by checkmate',
      resignation: win ? 'opponent resigned' : 'you resigned',
      stalemate: 'by stalemate',
      repetition: 'by threefold repetition',
      insufficient: 'insufficient material',
      fifty: 'by the 50-move rule',
      agreement: 'by agreement',
      left: 'opponent left',
    }[o.reason] || '';
    return { title, why };
  }
  function showResult() {
    if (!state || !state.over || state.over.reason === 'left') return;
    const { title, why } = resultText();
    $('r-title').textContent = title; $('r-why').textContent = why;
    $('result').style.display = 'flex';
  }
  $('result-x').onclick = () => { $('result').style.display = 'none'; };
  $('newgame').onclick = () => { location.href = '/'; };
  $('rematch').onclick = () => {
    if (rematchSent) return;
    rematchSent = true; socket.emit('rematch');
    $('rematch').textContent = 'Waiting for opponent…'; $('rematch').disabled = true;
  };

  // ───────── Moving pieces: click-click and drag ─────────
  const board = $('board');

  board.addEventListener('pointerdown', (e) => {
    ensureAudio();
    if (e.button !== undefined && e.button > 0) return;
    const el = e.target.closest('.sq'); if (!el || !state) return;
    const v = viewData();
    if (!v.live || state.over || state.turn !== myColor) return;
    const sq = el.dataset.sq;
    const grid = parseFen(state.fen);
    const piece = pieceAt(grid, sq);

    if (selected && selected !== sq && (state.legal[selected] || []).includes(sq)) {
      attemptMove(selected, sq); return;
    }
    if (piece && piece[0] === myColor) {
      selected = sq;
      renderBoard();
      const pe = board.querySelector(`[data-sq="${sq}"] .piece`);
      drag = { from: sq, code: piece, pid: e.pointerId, moved: false, x: e.clientX, y: e.clientY, pe };
      try { board.setPointerCapture(e.pointerId); } catch (err) {}
    } else {
      selected = null; renderBoard();
    }
  });

  board.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) {
      drag.moved = true;
      const size = board.getBoundingClientRect().width / 8;
      const g = $('ghost'); g.style.width = g.style.height = size + 'px'; g.style.display = 'block';
      $('ghost-img').src = pieceUrl(drag.code);
      if (drag.pe) drag.pe.style.opacity = '.35';
      drag.size = size;
    }
    if (drag.moved) {
      const g = $('ghost');
      g.style.left = e.clientX - drag.size / 2 + 'px';
      g.style.top = e.clientY - drag.size / 2 + 'px';
    }
  });

  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    $('ghost').style.display = 'none';
    try { board.releasePointerCapture(e.pointerId); } catch (err) {}
    if (d.moved && !cancelled) {
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const el = under && under.closest && under.closest('.sq');
      if (el && el.dataset.sq !== d.from && (state.legal[d.from] || []).includes(el.dataset.sq)) {
        attemptMove(d.from, el.dataset.sq); return;
      }
      selected = null;
    }
    renderBoard();
  }
  board.addEventListener('pointerup', (e) => endDrag(e, false));
  board.addEventListener('pointercancel', (e) => endDrag(e, true));

  function attemptMove(from, to) {
    const p = pieceAt(parseFen(state.fen), from);
    const promoRank = myColor === 'w' ? '8' : '1';
    if (p && p[1] === 'P' && to[1] === promoRank) { showPromo(from, to); return; }
    sendMove(from, to);
  }
  function sendMove(from, to, promotion) {
    selected = null;
    socket.emit('move', { from, to, promotion });
    renderBoard();
  }

  // Promotion picker (chess.com style column next to the target square)
  function showPromo(from, to) {
    pendingPromo = { from, to };
    const f = FILES.indexOf(to[0]);
    const df = flipped ? 7 - f : f;
    const atTop = (!flipped && myColor === 'w') || (flipped && myColor === 'b');
    const box = $('promo'); box.replaceChildren();
    const col = document.createElement('div'); col.className = 'col';
    col.style.left = df * 12.5 + '%';
    col.style[atTop ? 'top' : 'bottom'] = '0';
    const order = atTop ? ['q', 'n', 'r', 'b'] : ['b', 'r', 'n', 'q'];
    for (const t of order) {
      const o = document.createElement('div'); o.className = 'opt';
      const im = document.createElement('img'); im.src = pieceUrl(myColor + t.toUpperCase()); o.appendChild(im);
      o.onclick = (ev) => { ev.stopPropagation(); hidePromo(); sendMove(from, to, t); };
      col.appendChild(o);
    }
    box.appendChild(col);
    box.style.display = 'block';
  }
  function hidePromo() { $('promo').style.display = 'none'; pendingPromo = null; }
  $('promo').addEventListener('click', () => { hidePromo(); selected = null; renderBoard(); });

  // ───────── Side panel controls ─────────
  const total = () => state.moves.length;
  const curIdx = () => (viewIdx === null ? total() - 1 : viewIdx);
  function goto(i) {
    if (!state) return;
    i = Math.max(-1, Math.min(total() - 1, i));
    viewIdx = i >= total() - 1 ? null : i;
    selected = null; renderAll();
  }
  $('n-first').onclick = () => goto(-1);
  $('n-prev').onclick = () => goto(curIdx() - 1);
  $('n-next').onclick = () => goto(curIdx() + 1);
  $('n-last').onclick = () => goto(total() - 1);
  document.addEventListener('keydown', (e) => {
    if (!state || $('game').style.display === 'none') return;
    if (e.key === 'ArrowLeft') goto(curIdx() - 1);
    else if (e.key === 'ArrowRight') goto(curIdx() + 1);
    else if (e.key === 'ArrowUp') goto(-1);
    else if (e.key === 'ArrowDown') goto(total() - 1);
    else if (e.key === 'Escape') { hidePromo(); selected = null; renderBoard(); }
  });

  $('b-flip').onclick = () => { flipped = !flipped; renderBoard(); };
  $('b-sound').onclick = () => { soundOn = !soundOn; $('b-sound').textContent = soundOn ? '🔊' : '🔇'; };
  $('b-draw').onclick = () => {
    if (state.over) return;
    socket.emit('offer_draw');
    setStatusText('Draw offer sent', false);
  };
  $('d-yes').onclick = () => { socket.emit('respond_draw', { accept: true }); $('offer').style.display = 'none'; };
  $('d-no').onclick = () => { socket.emit('respond_draw', { accept: false }); $('offer').style.display = 'none'; };
  $('b-resign').onclick = () => {
    if (state.over) return;
    if (resignArmed) {
      clearTimeout(resignArmed); resignArmed = null;
      $('b-resign').textContent = '⚑ Resign';
      socket.emit('resign');
    } else {
      $('b-resign').textContent = 'Sure? Click again';
      resignArmed = setTimeout(() => { resignArmed = null; $('b-resign').textContent = '⚑ Resign'; }, 3000);
    }
  };
})();
</script>
</body>
</html>
